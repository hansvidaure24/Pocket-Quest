name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (the real game modules, run in Node)
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Self-play (bots play Practice Solo, a campaign and 3 Survival waves)
        run: npm run test:selfplay
